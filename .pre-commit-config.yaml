# pip install pre-commit && pre-commit install
# Fast checks on every commit; script/check runs the full CI suite.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy custom_components/xeno_saber_ble
        language: system
        types: [python]
        pass_filenames: false
