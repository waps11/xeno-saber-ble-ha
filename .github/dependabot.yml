version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # Conventional Commits: listed under "Project" in the changelog
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    commit-message:
      prefix: chore # test tooling only: not in the changelog
    # The oldest supported Home Assistant stays pinned.
    exclude-paths:
      - requirements_test_min.txt
    schedule:
      interval: weekly
    # These follow the versions the Home Assistant release pins, not their own
    # releases: update them together with pytest-homeassistant-custom-component.
    ignore:
      - dependency-name: aiousbwatcher
      - dependency-name: serialx
      - dependency-name: bleak
      - dependency-name: bleak-retry-connector
      - dependency-name: bluetooth-adapters
      - dependency-name: bluetooth-auto-recovery
      - dependency-name: bluetooth-data-tools
      - dependency-name: dbus-fast
      - dependency-name: habluetooth
    groups:
      test-dependencies:
        patterns: ["*"]
