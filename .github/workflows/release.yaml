name: Release

# Actions → Release → Run workflow, on main. Publishes the version in
# manifest.json: runs the tests and validation, builds xeno_saber_ble-<version>.zip,
# attests its build provenance, and creates the GitHub release and its tag with
# the matching CHANGELOG.md section as notes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  validate:
    uses: ./.github/workflows/validate.yaml

  release:
    needs: [tests, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and its changelog section
        id: meta
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/xeno_saber_ble/manifest.json'))['version'])")
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a version twice
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists: bump the version in manifest.json" >&2
            exit 1
          fi

      - name: Build the zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist build
          cp -r custom_components/xeno_saber_ble build/
          cp CHANGELOG.md build/xeno_saber_ble/
          (cd build && zip -qrX "../dist/xeno_saber_ble-$VERSION.zip" xeno_saber_ble)
          (cd dist && sha256sum "xeno_saber_ble-$VERSION.zip" | tee SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/xeno_saber_ble-${{ steps.meta.outputs.version }}.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo
            echo "### Installation"
            echo
            echo "- **HACS**: add this repository as a custom repository (category: Integration), install, then restart Home Assistant."
            echo "- **Manual**: unzip \`xeno_saber_ble-$VERSION.zip\` into \`config/custom_components/\`, then restart Home Assistant."
            echo
            echo "### Verify the download"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS)\`. Build provenance: \`gh attestation verify xeno_saber_ble-$VERSION.zip --repo $GITHUB_REPOSITORY\`"
          } >> notes.md
          gh release create "v$VERSION" "dist/xeno_saber_ble-$VERSION.zip" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file notes.md
