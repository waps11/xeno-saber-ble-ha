name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: catch Home Assistant changes early
  workflow_dispatch:
  workflow_call:
    inputs:
      cache:
        description: Use the dependency cache (the Release workflow turns it off)
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main,
# and those the Release workflow calls, are never cancelled.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  lint:
    name: Ruff and mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          # No cache when the Release workflow calls this: what gets published
          # is checked with dependencies downloaded afresh.
          enable-cache: ${{ inputs.cache != false }}
          cache-suffix: lint
      - name: Install Home Assistant, ruff and mypy
        run: uv pip install --system -r requirements_test.txt
      - run: script/check --lint
