name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Protocol, BLE client and translation tests
        run: >-
          pytest tests/test_protocol.py tests/test_device.py tests/test_device_files.py tests/test_transfer.py tests/test_soundfont.py tests/test_wled_udp.py
          tests/test_translations.py -p no:homeassistant
          --cov=custom_components/xeno_saber_ble --cov-report=
      - name: Home Assistant integration tests
        run: >-
          pytest tests/ha -o asyncio_mode=auto
          --cov=custom_components/xeno_saber_ble --cov-append
          --cov-report=term-missing --cov-fail-under=95
