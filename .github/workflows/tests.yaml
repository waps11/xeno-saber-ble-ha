name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      cache:
        description: Use the dependency cache (the Release workflow turns it off)
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main,
# and those the Release workflow calls, are never cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Home Assistant hacs.json allows, and the newest tested.
          - ha: "2026.2"
            python: "3.13"
            requirements: requirements_test_min.txt
          - ha: latest
            python: "3.14"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          # No cache when the Release workflow calls this: what gets published
          # is checked with dependencies downloaded afresh.
          enable-cache: ${{ inputs.cache != false }}
          cache-suffix: py${{ matrix.python }}
      - name: Install test dependencies
        run: uv pip install --system -r ${{ matrix.requirements }}
      - name: Tests
        run: script/check --tests
